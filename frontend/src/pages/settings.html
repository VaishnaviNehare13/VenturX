<div class="page-header">
 <h2>Settings</h2>
 <p class="lead muted">Manage your account settings and preferences.</p>
</div>

<div class="grid two">
 <div class="card">
  <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid rgba(148,163,184,0.1);">
   <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); border-radius: 50%; display: grid; place-items: center; color: white; font-size: 32px; font-weight: 700; box-shadow: 0 8px 24px rgba(99,102,241,0.3);">JD</div>
   <div>
    <h3 style="margin: 0 0 4px;">Aarav Sharma</h3>
    <p class="muted" style="margin: 0; font-size: 14px;">Administrator</p>
    <button class="btn-premium" style="margin-top: 8px; padding: 6px 12px; font-size: 13px;"> Change Photo</button>
   </div>
  </div>
  
  <h3>Profile Information</h3>
  <form id="profileForm" class="mt-16" onsubmit="handleSaveProfile(event)">
   <div class="grid" style="gap: 16px;">
    <div>
     <label class="muted" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Full Name</label>
     <input type="text" id="settingsName" value="Aarav Sharma" style="width: 100%;" required>
    </div>
    <div>
     <label class="muted" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Email Address</label>
     <input type="email" id="settingsEmail" value="john@startup.com" style="width: 100%;" required>
    </div>
    <div>
     <label class="muted" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Phone Number</label>
     <input type="text" id="settingsPhone" value="+1 (555) 123-4567" style="width: 100%;">
    </div>
    <div>
     <label class="muted" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Company</label>
     <input type="text" id="settingsCompany" value="Startup Inc." style="width: 100%;">
    </div>
    <div>
     <label class="muted" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Bio</label>
     <textarea id="settingsBio" rows="3" style="width: 100%; resize: vertical;">Building the next big thing in tech. Passionate about innovation and growth.</textarea>
    </div>
   </div>
   <div class="mt-16" style="display: flex; gap: 12px; justify-content: flex-end;">
    <button type="button" class="btn-premium" onclick="resetForm()">Cancel</button>
    <button type="submit" class="btn-premium"> Save Changes</button>
   </div>
  </form>
 </div>

 <div class="grid" style="grid-template-columns: 1fr; align-content: start; gap: 16px;">
  <div class="card">
   <h3><i data-lucide="palette" class="icon-sm text-purple-500"></i> Appearance</h3>
   <p class="muted" style="font-size: 13px; margin-top: 8px;">Customize how the dashboard looks on your device.</p>
   <div class="mt-16">
    <label class="muted" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Theme Preference</label>
    <select id="settingsTheme" style="width: 100%;" onchange="applyTheme(this.value)">
     <option value="corporate">Corporate (Blue/Teal)</option>
     <option value="dark">Midnight (Dark)</option>
     <option value="light">Clean (Light)</option>
     <option value="brand">Vibrant (Purple/Pink)</option>
     <option value="sunset">Sunset (Orange/Yellow)</option>
    </select>
   </div>
  </div>

  <div class="card">
   <h3><i data-lucide="bell" class="icon-sm text-amber-500"></i> Notifications</h3>
   <div class="mt-16" style="display: flex; flex-direction: column; gap: 14px;">
    <label style="display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; background: rgba(148,163,184,0.05); cursor: pointer;" onmouseover="this.style.background='rgba(148,163,184,0.1)'" onmouseout="this.style.background='rgba(148,163,184,0.05)'">
     <span style="font-size: 14px; font-weight: 500;"> Email Digests</span>
     <input type="checkbox" checked style="width: 18px; height: 18px; cursor: pointer;">
    </label>
    <label style="display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; background: rgba(148,163,184,0.05); cursor: pointer;" onmouseover="this.style.background='rgba(148,163,184,0.1)'" onmouseout="this.style.background='rgba(148,163,184,0.05)'">
     <span style="font-size: 14px; font-weight: 500;"><i data-lucide="target" class="icon-sm text-purple-500"></i> New Leads Alert</span>
     <input type="checkbox" checked style="width: 18px; height: 18px; cursor: pointer;">
    </label>
    <label style="display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; background: rgba(148,163,184,0.05); cursor: pointer;" onmouseover="this.style.background='rgba(148,163,184,0.1)'" onmouseout="this.style.background='rgba(148,163,184,0.05)'">
     <span style="font-size: 14px; font-weight: 500;"><i data-lucide="megaphone" class="icon-sm text-blue-500"></i> Marketing Updates</span>
     <input type="checkbox" style="width: 18px; height: 18px; cursor: pointer;">
    </label>
   </div>
  </div>

  <div class="card">
   <h3> Security</h3>
   <div class="mt-16" style="display: flex; flex-direction: column; gap: 12px;">
    <button class="btn-premium" style="width: 100%; justify-content: center;"> Change Password</button>
    <button class="btn-premium" style="width: 100%; justify-content: center;"><i data-lucide="smartphone" class="icon-sm text-blue-500"></i> Two-Factor Auth</button>
   </div>
  </div>
 </div>
</div>

<script>
function handleSaveProfile(e) {
 e.preventDefault();
 const data = {
  name: document.getElementById('settingsName').value,
  email: document.getElementById('settingsEmail').value,
  phone: document.getElementById('settingsPhone').value,
  company: document.getElementById('settingsCompany').value,
  bio: document.getElementById('settingsBio').value
 };
 console.log('Saving profile:', data);
 // Save to localStorage
 localStorage.setItem('userProfile', JSON.stringify(data));
 alert('<i data-lucide="check-circle-2" class="icon-sm text-green-500"></i> Profile saved successfully!');
}

function resetForm() {
 document.getElementById('profileForm').reset();
}

// Load saved profile
window.addEventListener('DOMContentLoaded', () => {
 const saved = localStorage.getItem('userProfile');
 if (saved) {
  const data = JSON.parse(saved);
  document.getElementById('settingsName').value = data.name || '';
  document.getElementById('settingsEmail').value = data.email || '';
  document.getElementById('settingsPhone').value = data.phone || '';
  document.getElementById('settingsCompany').value = data.company || '';
  document.getElementById('settingsBio').value = data.bio || '';
 }
 
 // Set current theme
 const theme = localStorage.getItem('theme') || 'corporate';
 document.getElementById('settingsTheme').value = theme;
});
</script>
